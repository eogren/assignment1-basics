[package]
# `name` here is name of the package.
name = "bpe-core"
# these are good defaults:
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.18.0"
itertools = "0.14.0"
memchr = "2.8.0"
memmap2 = "0.9.10"
priority-queue = "2.7.0"
rayon = "1.12.0"
rustc-hash = "2.1.2"
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
ctrlc = "3.5.2"
tempfile = "3.27.0"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
