[package]
# `name` here is name of the package.
name = "bpe-core"
# these are good defaults:
version = "0.1.0"
edition = "2021"

[dependencies]
fancy-regex = "0.18.0"
itertools = "0.14.0"
memchr = "2.8.0"
memmap2 = "0.9.10"
rayon = "1.12.0"
rustc-hash = "2.1.2"
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
debug = true
