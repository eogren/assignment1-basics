[project]
name = "cs336_basics"
version = "26.0.0"
description = "CS336 Assignment 1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",      # tensor operations
    "einx>=0.4",        # more general tensor operations
    "jaxtyping>=0.3",   # type hints for pytorch/jax/numpy
    "numpy>=2.4",
    "psutil>=7",
    "pytest>=9.0",
    "pytest-timeout",
    "regex>=2026.3.32", # more powerful regex than the builtin `re` module
    "tiktoken>=0.12.0",
    "torch~=2.11.0",
    "tqdm>=4.67",
    "wandb>=0.25",
    "ty>=0.0.26",
    "ruff>=0.15.8",
]

[project.scripts]
gpt2_flops = "cs336_basics.scripts.gpt2_flops:main"
train_tokenizer = "cs336_basics.scripts.train_tokenizer:main"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
manifest-path = "crates/bpe-py/Cargo.toml"
module-name = "cs336_basics.bpe_token"
features = ["pyo3/extension-module"]

[tool.uv]
python-preference = "managed"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jaxtyping>=0.3.9",
    "maturin>=1.7,<2.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP", "I", "B", "RUF"]
ignore = ["F722"]
